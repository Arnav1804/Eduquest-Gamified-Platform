<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – EduQuest</title>
  <meta name="description" content="Create your EduQuest account and start your learning journey today.">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card auth-card-wide">
    <div class="auth-header">
      <div class="auth-logo">✨</div>
      <h1>Create Account</h1>
      <p>Join EduQuest to start learning</p>
    </div>
    <div class="auth-body">
      <div class="role-tabs">
        <button class="tab-btn active" data-role="student" type="button">🎓 Student</button>
        <button class="tab-btn" data-role="faculty" type="button">👩‍🏫 Teacher</button>
      </div>

      <!-- ── Student Registration ──────────────────────────── -->
      <form id="student-form" class="form active" novalidate>
        <div class="grid-2">
          <div class="field">
            <label for="student-name">Full Name</label>
            <input id="student-name" type="text" placeholder="Your full name" class="input"
                   required aria-required="true" autocomplete="name" maxlength="50">
          </div>
          <div class="field">
            <label for="student-grade">Grade / Class</label>
            <select id="student-grade" class="input" required aria-required="true">
              <option value="6">Class 6</option>
              <option value="7">Class 7</option>
              <option value="8">Class 8</option>
              <option value="9">Class 9</option>
              <option value="10">Class 10</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="student-phone">Phone Number</label>
          <input id="student-phone" type="tel" placeholder="e.g. 9876543210" class="input"
                 required aria-required="true" autocomplete="tel" maxlength="10"
                 inputmode="numeric" pattern="\d{10}">
        </div>
        <div class="field">
          <label for="student-password">Password</label>
          <div class="password-wrapper">
            <input id="student-password" type="password" placeholder="Create a strong password" class="input"
                   required aria-required="true" autocomplete="new-password" maxlength="64">
          </div>
          <div id="student-password-strength-container"></div>
        </div>
        <div class="field">
          <label for="student-confirm-password">Confirm Password</label>
          <div class="password-wrapper">
            <input id="student-confirm-password" type="password" placeholder="Re-enter your password" class="input"
                   required aria-required="true" autocomplete="new-password" maxlength="64">
          </div>
        </div>
        <p id="student-error" class="field-error"></p>
        <button id="student-register-btn" class="primary-btn w-full primary-btn-center" type="submit">Create Account →</button>
        <p class="auth-footer-text-sm">Already have an account? <a class="link" href="login.html">Sign in</a></p>
      </form>

      <!-- ── Faculty Registration ──────────────────────────── -->
      <form id="faculty-form" class="form" novalidate>
        <div class="grid-2">
          <div class="field">
            <label for="faculty-name">Full Name</label>
            <input id="faculty-name" type="text" placeholder="Your full name" class="input"
                   required aria-required="true" autocomplete="name" maxlength="50">
          </div>
          <div class="field">
            <label for="faculty-phone">Phone Number</label>
            <input id="faculty-phone" type="tel" placeholder="e.g. 9876543210" class="input"
                   required aria-required="true" autocomplete="tel" maxlength="10"
                   inputmode="numeric" pattern="\d{10}">
          </div>
        </div>
        <div class="field">
          <label for="faculty-email">Email Address</label>
          <input id="faculty-email" type="email" placeholder="name@example.com" class="input"
                 required aria-required="true" autocomplete="email">
        </div>
        <div class="field">
          <label for="faculty-password">Password</label>
          <div class="password-wrapper">
            <input id="faculty-password" type="password" placeholder="Create a strong password" class="input"
                   required aria-required="true" autocomplete="new-password" maxlength="64">
          </div>
          <div id="faculty-password-strength-container"></div>
        </div>
        <div class="field">
          <label for="faculty-confirm-password">Confirm Password</label>
          <div class="password-wrapper">
            <input id="faculty-confirm-password" type="password" placeholder="Re-enter your password" class="input"
                   required aria-required="true" autocomplete="new-password" maxlength="64">
          </div>
        </div>
        <p id="faculty-error" class="field-error"></p>
        <button id="faculty-register-btn" class="primary-btn w-full primary-btn-center" type="submit">Create Account →</button>
        <p class="auth-footer-text-sm">Already have an account? <a class="link" href="login.html">Sign in</a></p>
      </form>
    </div>
  </div>
</div>

<script src="js/form-validation.js"></script>
<script>
const API_BASE = 'http://localhost:5050/api';

document.addEventListener('DOMContentLoaded', function() {
  const V = EduValidation;
  const tabs = document.querySelectorAll('.tab-btn');
  const studentForm = document.getElementById('student-form');
  const facultyForm = document.getElementById('faculty-form');

  // ── Role Tab Switching ────────────────────────────────────
  const params = new URLSearchParams(window.location.search);
  if (params.get('role') === 'faculty') setRole('faculty');

  function setRole(role) {
    tabs.forEach(t => t.classList.toggle('active', t.dataset.role === role));
    if (role === 'student') {
      studentForm.classList.add('active');
      facultyForm.classList.remove('active');
    } else {
      facultyForm.classList.add('active');
      studentForm.classList.remove('active');
    }
    V.clearAllErrors(studentForm);
    V.clearAllErrors(facultyForm);
  }
  tabs.forEach(t => t.addEventListener('click', () => setRole(t.dataset.role)));

  // ── Input References ──────────────────────────────────────
  // Student
  const sName = document.getElementById('student-name');
  const sGrade = document.getElementById('student-grade');
  const sPhone = document.getElementById('student-phone');
  const sPassword = document.getElementById('student-password');
  const sConfirm = document.getElementById('student-confirm-password');

  // Faculty
  const fName = document.getElementById('faculty-name');
  const fPhone = document.getElementById('faculty-phone');
  const fEmail = document.getElementById('faculty-email');
  const fPassword = document.getElementById('faculty-password');
  const fConfirm = document.getElementById('faculty-confirm-password');

  // ── Password Toggle & Strength UI ─────────────────────────
  V.createPasswordToggle(sPassword);
  V.createPasswordToggle(sConfirm);
  V.createPasswordToggle(fPassword);
  V.createPasswordToggle(fConfirm);

  const updateStudentStrength = V.createPasswordStrengthUI(
    document.getElementById('student-password-strength-container')
  );
  const updateFacultyStrength = V.createPasswordStrengthUI(
    document.getElementById('faculty-password-strength-container')
  );

  // Live password strength updates
  sPassword.addEventListener('input', () => updateStudentStrength(sPassword.value));
  fPassword.addEventListener('input', () => updateFacultyStrength(fPassword.value));

  // ── Live Validation Wiring ────────────────────────────────
  V.attachLiveValidation(sName, val => V.isValidName(val));
  V.attachLiveValidation(sPhone, val => V.isValidPhone(val));
  V.attachLiveValidation(sPassword, val => V.isValidPassword(val));
  V.attachLiveValidation(sConfirm, val => V.doPasswordsMatch(sPassword.value, val));

  V.attachLiveValidation(fName, val => V.isValidName(val));
  V.attachLiveValidation(fPhone, val => V.isValidPhone(val));
  V.attachLiveValidation(fEmail, val => V.isValidEmail(val));
  V.attachLiveValidation(fPassword, val => V.isValidPassword(val));
  V.attachLiveValidation(fConfirm, val => V.doPasswordsMatch(fPassword.value, val));

  // When password changes, re-validate confirm if it was already invalid
  sPassword.addEventListener('input', () => {
    const field = sConfirm.closest('.field');
    if (field && field.classList.contains('field-invalid')) {
      const result = V.doPasswordsMatch(sPassword.value, sConfirm.value);
      if (result.valid) V.clearFieldError(sConfirm);
    }
  });
  fPassword.addEventListener('input', () => {
    const field = fConfirm.closest('.field');
    if (field && field.classList.contains('field-invalid')) {
      const result = V.doPasswordsMatch(fPassword.value, fConfirm.value);
      if (result.valid) V.clearFieldError(fConfirm);
    }
  });

  // ── Validate All Fields (returns true if valid) ───────────
  function validateStudentForm() {
    let valid = true;
    const fields = [
      { input: sName, validator: () => V.isValidName(sName.value) },
      { input: sPhone, validator: () => V.isValidPhone(sPhone.value) },
      { input: sPassword, validator: () => V.isValidPassword(sPassword.value) },
      { input: sConfirm, validator: () => V.doPasswordsMatch(sPassword.value, sConfirm.value) },
    ];

    fields.forEach(({ input, validator }) => {
      const result = validator();
      if (!result.valid) {
        V.showFieldError(input, result.message);
        valid = false;
      }
    });

    return valid;
  }

  function validateFacultyForm() {
    let valid = true;
    const fields = [
      { input: fName, validator: () => V.isValidName(fName.value) },
      { input: fPhone, validator: () => V.isValidPhone(fPhone.value) },
      { input: fEmail, validator: () => V.isValidEmail(fEmail.value) },
      { input: fPassword, validator: () => V.isValidPassword(fPassword.value) },
      { input: fConfirm, validator: () => V.doPasswordsMatch(fPassword.value, fConfirm.value) },
    ];

    fields.forEach(({ input, validator }) => {
      const result = validator();
      if (!result.valid) {
        V.showFieldError(input, result.message);
        valid = false;
      }
    });

    return valid;
  }

  // ── Call the real backend to create an account ────────────
  async function doRegister(payload, errorEl, submitBtn, focusInputEl, focusForm) {
    V.setSubmitting(submitBtn, true);
    try {
      const res = await fetch(`${API_BASE}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (!res.ok) {
        V.setSubmitting(submitBtn, false);
        V.showFieldError(focusInputEl, data.error || 'Registration failed. Please try again.');
        V.focusFirstInvalid(focusForm);
        return;
      }

      window.location.href = 'login.html' + (payload.role === 'faculty' ? '?role=faculty' : '');
    } catch (err) {
      V.setSubmitting(submitBtn, false);
      errorEl.textContent = 'Could not connect to server. Make sure the backend is running.';
    }
  }

  // ── Student Registration ──────────────────────────────────
  studentForm.addEventListener('submit', function(e) {
    e.preventDefault();
    V.clearAllErrors(studentForm);
    V.trimAllInputs(studentForm);

    const submitBtn = document.getElementById('student-register-btn');

    if (!validateStudentForm()) {
      V.focusFirstInvalid(studentForm);
      return;
    }

    doRegister({
      name: sName.value.trim(),
      phone: sPhone.value.trim(),
      password: sPassword.value,
      role: 'student',
      gradeLevel: sGrade.value
    }, document.getElementById('student-error'), submitBtn, sPhone, studentForm);
  });

  // ── Faculty Registration ──────────────────────────────────
  facultyForm.addEventListener('submit', function(e) {
    e.preventDefault();
    V.clearAllErrors(facultyForm);
    V.trimAllInputs(facultyForm);

    const submitBtn = document.getElementById('faculty-register-btn');

    if (!validateFacultyForm()) {
      V.focusFirstInvalid(facultyForm);
      return;
    }

    doRegister({
      name: fName.value.trim(),
      phone: fPhone.value.trim(),
      email: fEmail.value.trim().toLowerCase(),
      password: fPassword.value,
      role: 'faculty'
    }, document.getElementById('faculty-error'), submitBtn, fEmail, facultyForm);
  });
});
</script>
</body>
</html>
